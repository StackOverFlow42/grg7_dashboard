<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schul-Organigramm & Dashboard - Kandlgasse</title>
    <style>
        :root {
            --bg-color: #f6f5f2;
            --text-main: #20241f;
            --text-muted: #7a7c73;
            --card-bg: #ffffff;
            --border-color: #e2e0d8;
            --border-strong: #c9c6ba;
            --header-bg: #2f5d4e;
            --accent-color: #2f5d4e;
            --serif: Georgia,'Iowan Old Style','Times New Roman',serif;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-main);
        }
        .k7-bar{background:var(--bg-color);border-bottom:1px solid var(--border-strong);padding:10px 40px;}
        .k7-bar-link{display:inline-flex;align-items:center;gap:8px;color:var(--text-main);text-decoration:none;font-size:.82rem;font-weight:600;}
        .k7-bar-link:hover{text-decoration:underline;}
        .k7-bar-mark{font-family:var(--serif);font-weight:700;border:1px solid var(--text-main);width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:.65rem;flex-shrink:0;}
        .k7-bar-sep{opacity:.5;}
        header {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-strong);
        }
        .header-title-container h1 {
            margin: 0;
            font-family: var(--serif);
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }
        .header-title-container p {
            margin: 4px 0 0 0;
            font-size: 0.82rem;
            color: var(--text-muted);
            opacity: 1;
        }
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .search-box {
            padding: 10px 16px;
            border: 1px solid var(--border-strong);
            background: var(--card-bg);
            color: var(--text-main);
            border-radius: 0;
            font-size: 0.95rem;
            width: 280px;
            outline: none;
            transition: all 0.2s;
        }
        .search-box::placeholder {
            color: var(--text-muted);
        }
        .search-box:focus {
            background: white;
            color: var(--text-main);
            border-color: var(--header-bg);
            box-shadow: none;
        }
        .btn {
            background-color: var(--text-main);
            color: white;
            border: 1px solid var(--text-main);
            padding: 10px 18px;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: none;
        }
        .btn:hover {
            background-color: var(--header-bg);
            border-color: var(--header-bg);
            transform: none;
        }
        .btn:active {
            transform: none;
        }
        
        .dashboard {
            padding: 40px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .stats-banner {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1px;
            background: var(--border-color);
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 0;
            border: none;
            box-shadow: none;
        }
        .stat-num {
            font-family: var(--serif);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--header-bg);
        }
        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        
        /* Grid Layout */
        .masonry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
            align-items: start;
        }
        
        .department-card {
            background: var(--card-bg);
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s;
        }
        .department-card:hover {
            transform: none;
            border-color: var(--border-strong);
        }
        
        .dept-header {
            padding: 16px 20px;
            color: white;
            font-family: var(--serif);
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .dept-body {
            padding: 20px;
        }
        
        .team-group {
            margin-bottom: 20px;
            background: var(--bg-color);
            border-radius: 0;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
        }
        .team-group:last-child {
            margin-bottom: 0;
        }
        .team-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .member-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .member-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-muted);
            padding: 4px 0;
            gap: 10px;
        }
        .member-name-container {
            display: flex;
            align-items: center;
        }
        .member-item strong {
            color: var(--text-main);
        }
        
        /* Avatar */
        .avatar-small {
            width: 26px;
            height: 26px;
            border-radius: 0;
            background-color: var(--bg-color);
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            margin-right: 10px;
            flex-shrink: 0;
            border: 1px solid var(--border-strong);
        }
        
        /* Links styling */
        .doc-link {
            display: inline-flex;
            align-items: center;
            color: var(--header-bg);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--bg-color);
            padding: 4px 10px;
            border-radius: 0;
            border: 1px solid var(--border-color);
            white-space: nowrap;
            transition: all 0.2s;
        }
        .doc-link:hover {
            border-color: var(--header-bg);
        }
        
        .search-highlight {
            background-color: #fbe7a1;
            color: #5c4419;
            border-radius: 0;
            padding: 0 2px;
            font-weight: bold;
        }
        
        .year-badge {
            background: var(--card-bg);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 0;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--border-strong);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
                text-align: center;
            }
            .controls {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

ren": []}, {"id": "PIR", "name": "PIR", "image": null, "children": []}, {"id": "SCS", "name": "SCS", "image": null, "children": []}]}, {"id": "PV", "name": "PV", "image": "https://images.lucid.app/images/4c0e7b6a-f3db-431c-9110-354b6fc0a3fe/content", "children": [{"id": "LEG", "name": "LEG", "image": null, "children": []}, {"id": "KAT", "name": "KAT", "image": null, "children": []}, {"id": "GRO", "name": "GRO", "image": null, "children": []}, {"id": "DES", "name": "DES", "image": null, "children": []}]}]}];
        const gridContainer = document.getElementById('gridContainer');
        const searchInput = document.getElementById('searchInput');
        const promoteBtn = document.getElementById('promoteBtn');
        const yearDisplay = document.getElementById('yearDisplay');
        
        // Premium modern desaturated colors
        const colors = ['#1e3a8a', '#0f766e', '#1e40af', '#6b21a8', '#9a3412', '#86198f', '#334155', '#166534', '#c2410c'];
        
        let currentYearOffset = 0;

        function formatLinks(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            let hasLink = false;
            let linkHtml = "";
            const cleanText = text.replace(urlRegex, function(url) {
                hasLink = true;
                linkHtml = `<a href="${url}" target="_blank" class="doc-link">🔗 Teams-Link</a>`;
                return "";
            });
            return { text: cleanText.trim().replace(/,\s*$/, '').replace(/^,\s*/, ''), linkHtml, hasLink };
        }

        function getInitials(name) {
            const clean = name.replace(/[^a-zA-ZäöüÄÖÜß\s]/g, '').trim();
            const parts = clean.split(/\s+/);
            let initials = "";
            for (let i = 0; i < Math.min(2, parts.length); i++) {
                if (parts[i].length > 0) initials += parts[i][0].toUpperCase();
            }
            return initials || "?";
        }

        function countStats(data) {
            let bereiche = data.length;
            let teams = 0;
            let personen = 0;
            
            data.forEach(top => {
                if (top.children) {
                    teams += top.children.length;
                    top.children.forEach(sub => {
                        if (sub.children) personen += sub.children.length;
                    });
                }
            });
            
            document.getElementById('stat-bereiche').innerText = bereiche;
            document.getElementById('stat-teams').innerText = teams;
            document.getElementById('stat-personen').innerText = personen;
        }

        function renderGrid(data, filterQuery = "") {
            gridContainer.innerHTML = '';
            
            data.forEach((topNode, index) => {
                const color = colors[index % colors.length];
                const card = document.createElement('div');
                card.className = 'department-card';
                
                let bodyHtml = '';
                let hasMatchingChild = false;
                
                const topNameMatch = highlightText(topNode.name, filterQuery);
                if (topNode.name.toLowerCase().includes(filterQuery)) hasMatchingChild = true;
                
                if (topNode.children && topNode.children.length > 0) {
                    topNode.children.forEach(subNode => {
                        let subNodeName = subNode.name;
                        
                        // Class promotion logic
                        if (isClassName(subNodeName) && currentYearOffset > 0) {
                            subNodeName = incrementClass(subNodeName, currentYearOffset);
                        }
                        if (subNodeName === "Absolventen" && currentYearOffset > 0 && isClassName(subNode.name)) {
                            return;
                        }

                        let subHasMatch = subNodeName.toLowerCase().includes(filterQuery);
                        const subNameMatch = highlightText(subNodeName, filterQuery);
                        
                        let membersHtml = '';
                        
                        if (subNode.children && subNode.children.length > 0) {
                            subNode.children.forEach(person => {
                                const { text: personNamePlain, linkHtml } = formatLinks(person.name);
                                
                                if (personNamePlain.toLowerCase().includes(filterQuery)) {
                                    subHasMatch = true;
                                }
                                
                                const personMatch = highlightText(personNamePlain, filterQuery);
                                
                                membersHtml += `
                                    <li class="member-item">
                                        <div class="member-name-container">
                                            <div class="avatar-small">${getInitials(personNamePlain)}</div>
                                            <strong>${personMatch}</strong>
                                        </div>
                                        ${linkHtml}
                                    </li>
                                `;
                            });
                        }
                        
                        if (subHasMatch || filterQuery === "" || topNode.name.toLowerCase().includes(filterQuery)) {
                            hasMatchingChild = true;
                            bodyHtml += `
                                <div class="team-group">
                                    <div class="team-title">${subNameMatch}</div>
                                    ${membersHtml ? `<ul class="member-list">${membersHtml}</ul>` : '<span style="font-size:0.85rem; color:#94a3b8; font-style:italic;">Keine Personen zugewiesen</span>'}
                                </div>
                            `;
                        }
                    });
                }
                
                card.innerHTML = `
                    <div class="dept-header" style="background-color: ${color}">
                        <span>${topNameMatch}</span>
                    </div>
                    <div class="dept-body">
                        ${bodyHtml || '<p style="color:#94a3b8; font-style:italic; font-size:0.9rem;">Keine Gruppen</p>'}
                    </div>
                `;
                
                if (hasMatchingChild || filterQuery === "") {
                    gridContainer.appendChild(card);
                }
            });
            
            if (gridContainer.innerHTML === '') {
                gridContainer.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 60px; color:#64748b; font-weight:500;">Keine Ergebnisse für "${filterQuery}" gefunden.</div>`;
            }
        }

        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query})`, "gi");
            return text.replace(regex, "<span class='search-highlight'>$1</span>");
        }

        function isClassName(str) {
            return /^[1-8][A-Z]?$/.test(str.trim());
        }

        function incrementClass(str, offset) {
            const match = str.trim().match(/^([1-8])([A-Z]?)$/);
            if (match) {
                let num = parseInt(match[1]) + offset;
                if (num > 8) return "Absolventen (Abschied)";
                return num + match[2];
            }
            return str;
        }

        searchInput.addEventListener('input', (e) => {
            renderGrid(rawData, e.target.value.toLowerCase().trim());
        });

        promoteBtn.addEventListener('click', () => {
            currentYearOffset++;
            const startYear = 25 + currentYearOffset;
            const endYear = 26 + currentYearOffset;
            yearDisplay.innerText = `Schuljahr ${startYear}/${endYear}`;
            renderGrid(rawData, searchInput.value.toLowerCase().trim());
        });

        // Init
        countStats(rawData);
        renderGrid(rawData);
    </script>
